<style>
:root{
  --bg:#FBF5EC;
  --card:#FFFFFF;
  --ink:#2A1D15;
  --ink2:#4B3A2D;
  --red:#A61E17;
  --red-dk:#7C150F;
  --gold:#C9952A;
  --gold-lt:#F7E6BC;
  --tip:#FFF3D1;
  --tip-bd:#E2B54A;
  --tip-ink:#5C3F00;
  --line:#E6D8C3;
  --alert:#FDE9E5;
  --focus:#1B5FBF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:22px;line-height:1.6;font-weight:400;
  overflow-wrap:anywhere;
}
a{color:var(--red-dk)}
strong{font-weight:700}
h1,h2,h3{font-weight:700}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 頁首 */
.hero{
  background:var(--red);background-image:linear-gradient(160deg,#B8261D 0%,#8E1912 100%);
  color:#fff;text-align:center;padding:26px 16px 22px;border-bottom:6px solid var(--gold);
}
.hero h1{font-size:38px;line-height:1.3;margin:0;letter-spacing:2px}
.hero .lantern{font-size:.8em;margin:0 .25em}
.nw{white-space:nowrap}
.hero .sub{font-size:22px;margin:6px 0 0}
.hero .count{display:inline-block;margin:14px 0 0;background:var(--gold-lt);color:var(--ink);
  font-weight:700;padding:6px 18px;border-radius:999px}
.hero .count:empty{display:none}

/* 分頁按鈕 */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);
  box-shadow:0 3px 10px rgba(60,30,10,.08)}
.tabs-inner{display:flex;gap:10px;overflow-x:auto;padding:10px 16px;max-width:760px;margin:0 auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{
  flex:0 0 auto;min-height:64px;min-width:108px;padding:6px 14px;
  border:2px solid var(--red);background:#fff;color:var(--red-dk);border-radius:14px;
  font:inherit;font-size:22px;font-weight:700;line-height:1.25;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
}
.tab .d{font-size:20px}
.tab[aria-selected="true"]{background:var(--red);color:#fff}
.tab .today{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--ink);
  font-size:16px;line-height:1;padding:4px 7px;border-radius:999px}
.tab:focus-visible,.btn:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:2px}

/* 內容 */
main{max-width:760px;margin:0 auto;padding:12px 16px 32px}
.panel[hidden]{display:none}
.day-head h2{font-size:34px;line-height:1.35;margin:10px 0 0}
.day-head h2 .dnum{display:block;font-size:26px;color:var(--ink2)}
.day-head .theme{font-size:26px;font-weight:700;color:var(--red-dk);margin:2px 0 0}
.lunar{display:inline-block;margin:8px 0 0;background:var(--gold-lt);border-radius:999px;padding:2px 14px;font-weight:700}
.intro{margin:12px 0 0}
.alert{background:var(--alert);border-left:6px solid var(--red);border-radius:12px;padding:12px 16px;margin:16px 0 0}
.alert p{margin:0}
.alert p+p{margin-top:8px}

.stops{list-style:none;margin:20px 0 0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 18px;
  box-shadow:0 1px 3px rgba(60,30,10,.06)}
.stop-head{display:flex;align-items:flex-start;gap:14px}
.time{flex:0 0 auto;min-width:3.1em;font-size:28px;font-weight:800;line-height:1.3;color:var(--red-dk);
  font-variant-numeric:tabular-nums}
.time .approx{display:block;font-size:20px;line-height:1.2}
.card h3{font-size:28px;line-height:1.35;margin:0}
.who{display:inline-block;margin:0 0 8px;background:var(--gold-lt);border-radius:999px;padding:2px 14px;font-weight:700}
.photo{margin:14px 0 0}
.photo img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#EFE6D8}
.desc{margin:12px 0 0}
.tip{margin:14px 0 0;background:var(--tip);border:2px solid var(--tip-bd);border-radius:12px;padding:10px 14px;color:var(--tip-ink)}
.tip .label{display:block;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 0}
.btn{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;padding:8px 18px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);
  font:inherit;font-size:22px;font-weight:700;line-height:1.3;text-align:center;text-decoration:none;cursor:pointer;
}
.btn-taxi{background:var(--red);border-color:var(--red);color:#fff}
.btn-call{background:#1F6B3A;border-color:#1F6B3A;color:#fff}

details.more{margin:14px 0 0;border:2px solid var(--line);border-radius:12px;background:#FFFCF6}
details.more>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:8px 12px 8px 14px;font-size:24px;font-weight:700}
details.more>summary::-webkit-details-marker{display:none}
.pm{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;font-weight:700}
.pm::before{content:"＋"}
details[open]>summary .pm::before{content:"－"}
details.more .body{padding:0 14px 14px}
details.more .body p{margin:8px 0 0}
details.backup{border-color:var(--gold);background:#FFF8E6}

.section-title{font-size:30px;margin:28px 0 12px;line-height:1.35}

/* 實用資料 */
.info h3{font-size:28px}
.info p{margin:8px 0 0}
.info ul{margin:8px 0 0;padding-left:1.2em}
.info li+li{margin-top:6px}
.flight{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.flight:first-of-type{border-top:0;padding-top:0}
.flight .label{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:0 12px;font-weight:700}
.flight .date{font-weight:700;margin-left:8px}
.leg{font-size:24px;margin-top:6px}
.leg .t{font-weight:800;font-size:28px;color:var(--red-dk);margin-right:8px;font-variant-numeric:tabular-nums}
.leg-mid{color:var(--ink2);margin:2px 0 2px 4px}
.big-addr{font-size:26px;font-weight:700;margin:8px 0 0}
.checklist{list-style:none;padding:0!important}
.checklist li{padding-left:1.6em;position:relative}
.checklist li::before{content:"☐";position:absolute;left:0;top:0;color:var(--red-dk);font-weight:700}

/* 的士卡 */
.taxi{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:#fff;display:none;
  flex-direction:column;padding:24px 18px;padding-bottom:calc(24px + env(safe-area-inset-bottom));overflow:auto}
.taxi.open{display:flex}
.taxi .ask{font-size:30px;font-weight:700;color:var(--ink2);margin:0}
.taxi .dest{font-size:52px;font-weight:800;line-height:1.3;margin:16px 0 0;color:#000}
.taxi .addr{font-size:42px;font-weight:700;line-height:1.4;margin:16px 0 0;color:#000}
.taxi .thanks{font-size:30px;margin:24px 0 0;color:var(--ink2)}
.taxi .close{flex:0 0 auto;margin-top:auto;width:100%;min-height:76px;font-size:32px}
.taxi-spacer{flex:1 1 24px;min-height:24px}
body.locked{overflow:hidden}

footer{max-width:760px;margin:0 auto;padding:8px 16px 40px;color:var(--ink2)}
.credits{font-size:16px;line-height:1.5;border-top:2px solid var(--line);padding-top:12px}
.credits h2{font-size:20px;margin:0 0 8px}
.credits ol{margin:0;padding-left:1.4em}
.credits li{margin:0 0 6px}
.credits a{color:var(--ink2)}
.updated{font-size:18px;margin:16px 0 0}

@media (min-width:700px){
  .hero h1{font-size:46px}
}
@media (max-width:360px){
  .hero .lantern{display:none}
  .hero h1{font-size:34px}
  .hero .nw{white-space:normal}
}
@media print{
  .tabs,.actions,.taxi{display:none!important}
  .panel[hidden]{display:block!important}
}
</style>
</head>

  <p class="sub"><span class="nw">2月13日至17日</span> · <span class="nw">逸東酒店</span> · <span class="nw">國泰航空</span></p>

    if (!t) return '';
    TAXI.push(t);
    return '<button type="button" class="btn btn-taxi" data-taxi="' + (TAXI.length - 1) + '">' +
           (label || '<span aria-hidden="true">🚕</span>給的士司機看') + '</button>';
  }
  function photo(slug, alt) {
    var p = slug && PHOTOS[slug];
    if (!p) return '';
    if (USED_PHOTOS.indexOf(slug) < 0) USED_PHOTOS.push(slug);
    var src = photoSrc(slug);
    return '<figure class="photo"><img src="' + src + '" alt="' + alt +
           '" width="1200" height="675" loading="lazy" decoding="async" referrerpolicy="no-referrer"></figure>';
  }
  function tipBox(tip) {
    return tip ? '<div class="tip"><span class="label">👴👵 爸媽小提示</span>' + tip + '</div>' : '';
  }
  function moreBox(m, cls) {
    if (!m) return '';
    return '<details class="more' + (cls ? ' ' + cls : '') + '"><summary><span>' + m.title +
           '</span><span class="pm" aria-hidden="true"></span></summary><div class="body">' + m.html +
           (m.img ? photo(m.img, m.alt) : '') +
           (m.maps ? '<div class="actions">' + mapButtons(m.maps) + '</div>' : '') +
           '</div></details>';
  }
  function actions(s) {
    var html = mapButtons(s.maps) + taxiButton(s.taxi, s.taxiLabel);
    return html ? '<div class="actions">' + html + '</div>' : '';
  }

  function renderStop(s) {
    var time = s.approx ? '<span class="approx">約</span>' + s.time : s.time;
    return '<li class="card stop">' +
      '<div class="stop-head"><div class="time">' + time + '</div><h3>' + s.name + '</h3></div>' +
      photo(s.img, s.alt) +
      '<p class="desc">' + s.desc + '</p>' +
      tipBox(s.tip) + moreBox(s.more) + actions(s) +
      '</li>';
  }
  function renderOption(o, i) {
    return '<li class="card option">' +
      '<span class="who">' + o.who + '</span>' +
      '<h3>' + (i + 1) + '. ' + o.name + '</h3>' +
      photo(o.img, o.alt) +
      '<p class="desc">' + o.desc + '</p>' +
      tipBox(o.tip) + actions(o) +
      '</li>';
  }

  function renderDay(d) {
    var h = '<div class="day-head"><h2><span class="dnum">' + d.num + '</span>' + d.title + '</h2>' +
            '<p class="theme">' + d.theme + '</p>' +
            '<span class="lunar">🧧 ' + d.lunar + '</span></div>';
    if (d.intro) h += '<p class="intro">' + d.intro + '</p>';
    if (d.alert) h += '<div class="alert">' + d.alert.map(function (a) { return '<p>' + a + '</p>'; }).join('') + '</div>';
    if (d.options) {
      h += '<h3 class="section-title">今天可以選的活動</h3>' +
           '<ol class="stops" style="margin-top:0">' + d.options.map(renderOption).join('') + '</ol>' +
           '<h3 class="section-title">下午一起</h3>';
      h += '<ol class="stops" style="margin-top:0">' + d.stops.map(renderStop).join('') + '</ol>';
    } else {
      h += '<ol class="stops">' + d.stops.map(renderStop).join('') + '</ol>';
    }
    if (d.backup) h += moreBox(d.backup, 'backup');
    return h;
  }

  function renderInfo() {
    return '<div class="day-head"><h2>實用資料</h2></div>' +
      '<ol class="stops info">' +

      '<li class="card"><h3>✈️ 航班（國泰航空）</h3>' +
        '<div class="flight"><span class="label">去程</span><span class="date">2月13日（六）</span>' +
          '<div class="leg"><span class="t">02:55</span>吉隆坡 KUL T1 出發</div>' +
          '<div class="leg-mid">↓ 直飛 4小時5分</div>' +
          '<div class="leg"><span class="t">07:00</span>香港 HKG T1 抵達</div>' +
          '<div class="alert"><p>凌晨的航班：<strong>2月12日（五）晚上</strong>就要出門去機場！</p></div></div>' +
        '<div class="flight"><span class="label">回程</span><span class="date">2月17日（三）</span>' +
          '<div class="leg"><span class="t">17:30</span>香港 HKG T1 出發</div>' +
          '<div class="leg-mid">↓ 直飛 4小時5分</div>' +
          '<div class="leg"><span class="t">21:35</span>吉隆坡 KUL T1 抵達</div></div>' +
        '<p>經濟艙，每人 <strong>1 件 23 公斤</strong>寄艙行李，有飛機餐。</p></li>' +

      '<li class="card"><h3>🏨 酒店</h3>' +
        '<p><strong>香港逸東酒店</strong>（朗廷酒店集團旗下）</p>' +
        '<p class="big-addr">九龍佐敦彌敦道380號</p>' +
        '<p>電話：+852 2782 1818</p>' +
        '<p>房型：逸·雅大床房（可免費取消）。就在佐敦港鐵站旁邊，地庫有美食廣場，對面馬路有 A21 機場巴士站（彌敦酒店站）。</p>' +
        '<div class="actions">' + taxiButton(HOTEL) + mapButtons([{ q: HOTEL_MAP }]) +
          '<a class="btn btn-call" href="tel:+85227821818"><span aria-hidden="true">📞</span>打電話給酒店</a></div></li>' +

      '<li class="card"><h3>🧥 天氣與衣著</h3>' +
        '<p>二月的香港天氣涼，常常有點潮濕，大約 <strong>14–20°C</strong>。早上、晚上會比較冷，山頂和船上更冷。</p>' +
        '<div class="tip"><span class="label">要帶</span>帶外套、薄羽絨或毛衣，可能有毛毛雨，帶摺傘。</div></li>' +

      '<li class="card"><h3>🧧 農曆新年提示</h3>' +
        '<p>2027年農曆新年是 2月6日（六）。我們的行程是<strong>年初八到正月十二</strong>，街上還有新年裝飾。</p>' +
        '<p>公眾假期已經過了，但少數家庭式小店可能還在放新年假——<strong>出發前最好再確認小店有沒有開</strong>。</p>' +
        '<p>2月14日（日）是<strong>情人節</strong>，晚上餐廳很多人，想坐下吃熱門餐廳要先訂位。</p></li>' +

      '<li class="card"><h3>💳 八達通</h3>' +
        '<p>坐港鐵、巴士、電車、天星小輪都用八達通，便利店也可以用。到埗後先買好，記得保持有餘額。</p></li>' +

      '<li class="card"><h3>🛂 證件</h3>' +
        '<p>去澳門（第3天）<strong>一定要帶護照</strong>。馬來西亞護照進澳門免簽。</p></li>' +

      '<li class="card"><h3>☎️ 緊急電話</h3>' +
        '<p>香港：<strong>999</strong>　澳門：<strong>999</strong></p>' +
        '<div class="actions"><a class="btn btn-call" href="tel:999"><span aria-hidden="true">📞</span>撥打 999</a></div></li>' +

      '<li class="card"><h3>📝 出發前要訂好</h3>' +
        '<ul class="checklist">' +
          '<li>山頂纜車票（2月14日早上的指定時段）</li>' +
          '<li>澳門船票：去程「上環 → 澳門外港」、回程「氹仔 → 上環」（2月15日）</li>' +
          '<li>情人節晚餐訂位（2月14日，尖沙咀）</li>' +
          '<li>最後一晚全家晚餐（2月16日，尖沙咀）</li>' +
        '</ul></li>' +

      '</ol>';
  }

  function renderCredits() {
    if (!USED_PHOTOS.length) return '';
    return '<section class="credits"><h2>相片來源</h2><ol>' +
      USED_PHOTOS.map(function (slug) {
        var p = PHOTOS[slug];
        var lic = LICENSES[p.lic];
        return '<li>' + p.what + '：' + p.by + '，' +
               (lic ? '<a href="' + lic + '" target="_blank" rel="noopener">' + p.lic + '</a>' : p.lic) +
               '，<a href="' + photoPage(p) + '" target="_blank" rel="noopener">Wikimedia Commons</a></li>';
      }).join('') + '</ol></section>';
  }

  /* ===== 建立頁面 ===== */
  var tabsEl = document.getElementById('tabs');
  var mainEl = document.getElementById('main');
  var todayId = todayTab();

  var tabHtml = '', panelHtml = '';
  DAYS.forEach(function (d) {
    tabHtml += '<button type="button" class="tab" role="tab" id="tab-' + d.id + '" aria-controls="' + d.id +
               '" aria-selected="false" tabindex="-1">' + d.tab + '<span class="d">' + d.date + '</span>' +
               (todayId === d.id ? '<span class="today">今天</span>' : '') + '</button>';
    panelHtml += '<section class="panel" role="tabpanel" id="' + d.id + '" aria-labelledby="tab-' + d.id + '" hidden>' +
                 renderDay(d) + '</section>';
  });
  tabHtml += '<button type="button" class="tab" role="tab" id="tab-info" aria-controls="info" aria-selected="false" tabindex="-1">實用<span class="d">資料</span></button>';
  panelHtml += '<section class="panel" role="tabpanel" id="info" aria-labelledby="tab-info" hidden>' + renderInfo() + '</section>';

  tabsEl.innerHTML = tabHtml;
  mainEl.innerHTML = panelHtml;
  document.getElementById('footer').innerHTML = renderCredits() +
    '<p class="updated">最後更新：' + UPDATED + '</p>';

  /* ===== 倒數 ===== */
  (function () {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var start = new Date(2027, 1, 13);
    var diff = Math.round((start - today) / 86400000);
    var el = document.getElementById('count');
    if (diff > 1) el.textContent = '距離出發還有 ' + diff + ' 天';
    else if (diff === 1) el.textContent = '今晚出發！半夜12點前到機場';
    else if (todayId) el.textContent = '今天是' + todayId.replace('d', '第') + '天，玩得開心！';
  })();

  /* ===== 分頁 ===== */
  function todayTab() {
    var n = new Date();
    if (n.getFullYear() === 2027 && n.getMonth() === 1 && n.getDate() >= 13 && n.getDate() <= 17) {
      return 'd' + (n.getDate() - 12);
    }
    return null;
  }

  function showTab(id, opts) {
    opts = opts || {};
    TAB_IDS.forEach(function (t) {
      var tab = document.getElementById('tab-' + t);
      var panel = document.getElementById(t);
      var on = t === id;
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
      panel.hidden = !on;
    });
    var active = document.getElementById('tab-' + id);
    // 把選中的分頁捲到看得見的位置
    var box = tabsEl;
    var left = active.offsetLeft - (box.clientWidth - active.offsetWidth) / 2;
    box.scrollLeft = Math.max(0, left);
    if (opts.focus) active.focus();
    if (opts.save) {
      try { localStorage.setItem(STORE_KEY, id); } catch (e) { /* 儲存被封鎖也沒關係 */ }
    }
    if (opts.scroll) {
      var nav = document.querySelector('.tabs');
      var top = mainEl.getBoundingClientRect().top + window.pageYOffset - nav.offsetHeight;
      if (window.pageYOffset > top) window.scrollTo(0, top);
    }
  }

  function initialTab() {
    var h = (location.hash || '').replace('#', '');
    if (TAB_IDS.indexOf(h) >= 0) return h;
    if (todayId) return todayId;
    try {
      var s = localStorage.getItem(STORE_KEY);
      if (s && TAB_IDS.indexOf(s) >= 0) return s;
    } catch (e) { /* 儲存被封鎖 */ }
    return 'd1';
  }

  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.tab') : null;
    if (!btn) return;
    showTab(btn.id.replace('tab-', ''), { save: true, scroll: true });
  });
  tabsEl.addEventListener('keydown', function (e) {
    var cur = TAB_IDS.indexOf(document.activeElement.id.replace('tab-', ''));
    if (cur < 0) return;
    var next = null;
    if (e.key === 'ArrowRight') next = (cur + 1) % TAB_IDS.length;
    else if (e.key === 'ArrowLeft') next = (cur - 1 + TAB_IDS.length) % TAB_IDS.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = TAB_IDS.length - 1;
    if (next === null) return;
    e.preventDefault();
    showTab(TAB_IDS[next], { save: true, focus: true });
  });

  showTab(initialTab());

  /* ===== 給的士司機看 ===== */
  var overlay = document.getElementById('taxi');
  var closeBtn = document.getElementById('taxi-close');
  var opener = null;
  var pushed = false;

  function openTaxi(t, from) {
    document.getElementById('taxi-dest').textContent = t.name;
    document.getElementById('taxi-addr').textContent = t.addr;
    opener = from;
    overlay.hidden = false;
    overlay.classList.add('open');
    document.body.classList.add('locked');
    overlay.scrollTop = 0;
    closeBtn.focus();
    // 讓手機的「返回」鍵只關閉卡片，不會離開網頁
    try { history.pushState({ taxi: true }, ''); pushed = true; } catch (e) { pushed = false; }
  }
  function hideTaxi() {
    overlay.classList.remove('open');
    overlay.hidden = true;
    document.body.classList.remove('locked');
    if (opener) opener.focus();
  }
  function closeTaxi() {
    if (overlay.hidden) return;
    if (pushed) { pushed = false; history.back(); } else { hideTaxi(); }
  }
  window.addEventListener('popstate', function () {
    if (!overlay.hidden) { pushed = false; hideTaxi(); }
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-taxi]') : null;
    if (btn) openTaxi(TAXI[+btn.getAttribute('data-taxi')], btn);
  });
  closeBtn.addEventListener('click', closeTaxi);
  // 相片載入失敗就整張拿走，不留空白框
  document.addEventListener('error', function (e) {
    var fig = e.target.tagName === 'IMG' && e.target.closest ? e.target.closest('.photo') : null;
    if (fig) fig.parentNode.removeChild(fig);
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeTaxi();
  });
  overlay.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
  });
})();
</script>
</body>
</html>
